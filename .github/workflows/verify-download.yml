name: Diagnose published Suwatte source download
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build and publish Suwatte source list]
    types: [completed]
permissions:
  contents: read
jobs:
  check-download:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and bootstrap every catalog-resolved plugin
        run: npm run test:published
