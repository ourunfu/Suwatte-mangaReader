name: Check JavaScriptCore on macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jsc-parse:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build source
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Parse with native Apple JavaScriptCore
        run: swift scripts/check_jsc.swift dist/sources/zh.copymanga.stt
