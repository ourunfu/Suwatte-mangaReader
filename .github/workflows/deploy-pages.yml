name: Build and publish Suwatte source list
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: suwatte-catalog
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and mocked reader tests
        run: |
          npm run check
          npm test
      - name: Build Suwatte sources
        run: npm run build
      - name: Validate generated catalog
        run: |
          test -s dist/sources.json
          test -s dist/sources/zh.copymanga.stt
          node -e 'const l=require("./dist/sources.json");if(l.catalogVersion!==2||!l.sources.some(x=>x.id==="zh.copymanga"))process.exit(1)'
      - name: Publish compiled catalog to dedicated gh-pages branch
        run: |
          mkdir -p /tmp/suwatte-catalog
          cp -a dist/. /tmp/suwatte-catalog/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -r -f --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/suwatte-catalog/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish compiled Suwatte catalog [skip ci]"
          git push --force origin HEAD:gh-pages
      - name: Print source list URL
        run: |
          echo "Use https://cdn.jsdelivr.net/gh/ourunfu/Suwatte-mangaReader@gh-pages/sources.json"
