name: Build and publish Suwatte source list
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and run mocked reader tests
        run: |
          npm run check
          npm test
      - name: Build Suwatte sources
        run: npm run build
      - name: Validate catalog and source output
        run: |
          test -s dist/sources.json
          test -s dist/sources/zh.copymanga.stt
          node -e 'const l=require("./dist/sources.json");if(l.catalogVersion!==2||!l.sources.some(x=>x.id==="zh.copymanga"))process.exit(1)'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
