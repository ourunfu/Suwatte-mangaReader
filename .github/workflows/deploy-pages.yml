name: Build and publish Suwatte source list
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: suwatte-catalog
  cancel-in-progress: true
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and mocked reader tests
        run: |
          npm run check
          npm test
      - name: Build Suwatte sources
        run: npm run build
      - name: Validate compiled bundle bootstrap
        run: npm run test:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: suwatte-catalog
          path: dist/
          if-no-files-found: error
      - name: Publish compiled catalog to dedicated gh-pages branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          publish_dir="$RUNNER_TEMP/suwatte-catalog"
          git worktree add --detach "$publish_dir" FETCH_HEAD
          git -C "$publish_dir" rm -r --ignore-unmatch .
          cp -a dist/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" add -A
          git -C "$publish_dir" commit -m "Publish Suwatte catalog from $GITHUB_SHA [skip ci]"
          git -C "$publish_dir" push origin HEAD:gh-pages
          echo "sha=$(git -C "$publish_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify exact published bytes from raw GitHub and CDN
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          npm run test:published -- --base "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$PUBLISHED_SHA" --expected-dir dist
          npm run test:published -- --base "https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@$PUBLISHED_SHA" --expected-dir dist
          npm run test:published -- --expected-dir dist
      - name: Print source list URL
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          echo "Saved List: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages"
          echo "Pinned Saved List: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$PUBLISHED_SHA"
          echo "Do not append /sources.json to the Saved List address."
